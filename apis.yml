description: >-
  Applied Materials, Inc. (NASDAQ: AMAT) is the global leader in materials engineering
  solutions used to produce virtually every new chip and advanced display in the world,
  supplying deposition, etch, chemical mechanical planarization, ion implantation,
  metrology and inspection equipment to semiconductor, display and adjacent markets. Its
  Applied SmartFactory business unit (appliedsmartfactory.com) ships the software side of
  that portfolio - PROMIS and 300works MES, SPC and process-quality, scheduling,
  dispatching and material-control products for fabs. Applied Materials publishes no
  public developer portal, API reference or machine-readable API contract; software is
  delivered under enterprise licence and support runs through customer portals.
