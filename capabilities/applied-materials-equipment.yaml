naftiko: 1.0.0-alpha2
info:
  label: Applied Materials Equipment Management API — Equipment
  description: 'Applied Materials Equipment Management API — Equipment. 2 operations. Lead operation: Applied Materials -
    List Equipment. Self-contained Naftiko capability covering one Applied Materials business surface.'
  tags:
  - Applied Materials
  - Equipment
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APPLIED_MATERIALS_API_KEY: APPLIED_MATERIALS_API_KEY
capability:
  consumes:
  - type: http
    namespace: applied-materials-equipment
    baseUri: https://api.applied-materials.com/v1
    description: Applied Materials Equipment Management API — Equipment business capability. Self-contained, no shared references.
    resources:
    - name: equipment
      path: /equipment
      operations:
      - name: listequipment
        method: GET
        description: Applied Materials - List Equipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter by equipment type (CVD, PVD, CMP, Etch)
        - name: status
          in: query
          type: string
          description: Filter by operational status
        - name: location
          in: query
          type: string
          description: Filter by fab location
    - name: equipment-equipmentId
      path: /equipment/{equipmentId}
      operations:
      - name: getequipment
        method: GET
        description: Applied Materials - Get Equipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: equipmentId
          in: path
          type: string
          description: Unique equipment identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.APPLIED_MATERIALS_API_KEY}}'
  exposes:
  - type: rest
    namespace: applied-materials-equipment-rest
    port: 8080
    description: REST adapter for Applied Materials Equipment Management API — Equipment. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/equipment
      name: equipment
      description: REST surface for equipment.
      operations:
      - method: GET
        name: listequipment
        description: Applied Materials - List Equipment
        call: applied-materials-equipment.listequipment
        with:
          type: rest.type
          status: rest.status
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/equipment/{equipmentid}
      name: equipment-equipmentid
      description: REST surface for equipment-equipmentId.
      operations:
      - method: GET
        name: getequipment
        description: Applied Materials - Get Equipment
        call: applied-materials-equipment.getequipment
        with:
          equipmentId: rest.equipmentId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: applied-materials-equipment-mcp
    port: 9090
    transport: http
    description: MCP adapter for Applied Materials Equipment Management API — Equipment. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: applied-materials-list-equipment
      description: Applied Materials - List Equipment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: applied-materials-equipment.listequipment
      with:
        type: tools.type
        status: tools.status
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.
    - name: applied-materials-get-equipment
      description: Applied Materials - Get Equipment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: applied-materials-equipment.getequipment
      with:
        equipmentId: tools.equipmentId
      outputParameters:
      - type: object
        mapping: $.
